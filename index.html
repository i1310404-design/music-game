
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJSK AI 譜面專家 v5.1</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;700;900&display=swap');

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:'Noto Sans TC',sans-serif;
    overflow:hidden;
}

.phone{
    width:390px;
    height:840px;
    background:#0f172a;
    border:10px solid #1a1a1a;
    border-radius:45px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,255,200,0.15);
}

.light .phone{
    background:#f8fafc;
    color:#111827;
    border-color:#cbd5e1;
}

.preview-box{
    width:100%;
    height:300px;
    background:black;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.preview-box img{
    width:100%;
    height:100%;
    object-fit:fill;
}

.scan-line{
    position:absolute;
    width:100%;
    height:4px;
    background:#00ffd5;
    box-shadow:0 0 20px #00ffd5;
    animation:scan 2s infinite;
    z-index:5;
}

@keyframes scan{
    0%{top:0%;}
    50%{top:100%;}
    100%{top:0%;}
}

.note-tag{
    position:absolute;
    transform:translate(-50%,-100%);
    padding:3px 8px;
    border-radius:7px;
    font-size:10px;
    font-weight:900;
    color:white;
    font-family:'Orbitron',sans-serif;
    z-index:10;
    animation:pop 0.2s ease;
    pointer-events:none;
}

@keyframes pop{
    from{opacity:0; transform:translate(-50%,0%);}
    to{opacity:1; transform:translate(-50%,-100%);}
}

.blue{ background:linear-gradient(#00d4ff,#0044ff); }
.red{ background:linear-gradient(#ff6666,#b30000); }

::-webkit-scrollbar{ width:0px; }
</style>
</head>

<body id="app"
class="flex justify-center items-center min-h-screen"
:class="settings.theme === 'light' ? 'light' : ''">

<div class="phone">

<div class="h-8 flex justify-center items-center">
    <div class="w-24 h-5 bg-black rounded-b-2xl"></div>
</div>

<button @click="showSettings = true"
    class="absolute top-12 right-5 z-50 w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center">
    ⚙️
</button>

<main class="flex-1 p-6 overflow-y-auto">

<!-- HOME -->
<div v-if="view === 'home'" class="flex flex-col h-full">

    <div class="mt-10 text-center">

        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500"
            style="font-family:'Orbitron'">
            DECODER PRO
        </h1>

        <p class="text-xs opacity-40 mt-2 tracking-[3px]">
            PROJECT SEKAI ANALYZER
        </p>

    </div>

    <div class="mt-10 flex-1 border-2 border-dashed border-slate-700 rounded-[35px] flex flex-col items-center justify-center p-8 bg-slate-800/30 cursor-pointer"
        @click="$refs.file.click()" @paste="handlePaste">

        <input type="file" ref="file" accept="image/*" class="hidden" @change="handleUpload">

        <template v-if="!uploadedImg">
            <div class="text-6xl">🖼️</div>
            <p class="mt-5 font-bold">點擊上傳 或 Ctrl+V 貼上</p>
            <p class="text-xs opacity-40 mt-2">支援 PJSK 截圖</p>
        </template>

        <img v-else :src="uploadedImg" class="max-h-full rounded-2xl object-contain">

    </div>

    <button class="mt-8 py-5 rounded-2xl font-black text-xl bg-gradient-to-r from-cyan-600 to-blue-700"
        :disabled="!uploadedImg || isAnalyzing"
        @click="startAnalysis">

        <span v-if="isAnalyzing">ANALYZING...</span>
        <span v-else>開始讀譜</span>

    </button>

</div>

<!-- RESULT -->
<div v-if="view === 'result'" class="flex flex-col h-full">

    <h2 class="text-cyan-400 text-xs font-black tracking-[3px] mt-4">
        AI ANALYSIS
    </h2>

    <div class="mt-3 p-4 rounded-2xl bg-white/5 border-l-4 border-cyan-500 text-sm leading-relaxed">
        {{ analysisOutput }}
    </div>

    <h2 class="text-pink-500 text-xs font-black tracking-[3px] mt-6">
        NOTE ANALYSIS
    </h2>

    <div class="preview-box mt-3">

        <div v-if="isAnalyzing" class="scan-line"></div>

        <img :src="uploadedImg">

        <div v-for="tag in noteTags"
            :key="tag.id"
            class="note-tag"
            :class="tag.hand === 'L' ? 'blue' : 'red'"
            :style="{ left: tag.x + '%', top: tag.y + '%' }">

            {{ tag.label }}

        </div>

    </div>

    <div class="mt-4 text-xs opacity-70 leading-7">
        <div>偵測到物件數：{{ noteTags.length }}</div>
        <div>判定密度：{{ densityText }}</div>
        <div>主要配置：{{ patternText }}</div>
    </div>

    <div class="mt-auto flex gap-3 pt-6">

        <button class="flex-1 py-4 rounded-2xl bg-white/10 font-bold"
            @click="view = 'home'">返回</button>

        <button class="flex-1 py-4 rounded-2xl bg-cyan-600 font-black"
            @click="startAnalysis">重新分析</button>

    </div>

</div>

</main>

</div>

<canvas ref="canvas" style="display:none;"></canvas>

<script>
const { createApp } = Vue;

createApp({

data(){
return{
view:'home',
showSettings:false,
isAnalyzing:false,
uploadedImg:null,
analysisOutput:'',
noteTags:[],
densityText:'',
patternText:'',
settings:{ fingers:'thumb', theme:'dark' },

/* Ctrl+V 修復 */
isPasting:false,
lastPasteTime:0
}
},

mounted(){

this._onPaste = (e) => {
    this.handlePaste(e);
};

window.addEventListener('paste', this._onPaste, true);

},

beforeUnmount(){

if(this._onPaste){
    window.removeEventListener('paste', this._onPaste, true);
}

},

methods:{

handleUpload(e){
this.loadImage(e.target.files[0]);
},

handlePaste(e){

const now = Date.now();

if(this.isPasting || now - this.lastPasteTime < 500){
    return;
}

this.lastPasteTime = now;
this.isPasting = true;

e.preventDefault();
e.stopPropagation();

let file = null;

if(e.clipboardData && e.clipboardData.items){

    const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
    if(item) file = item.getAsFile();

}

if(!file && e.clipboardData && e.clipboardData.files && e.clipboardData.files.length){
    file = e.clipboardData.files[0];
}

if(file){
    this.loadImage(file);
}else{
    this.isPasting = false;
}

},

loadImage(file){
if(!file){
    this.isPasting = false;
    return;
}
const r=new FileReader();
r.onload=e=>{
    this.uploadedImg=e.target.result;
    setTimeout(()=>{
        this.isPasting = false;
    },100);
};
r.onerror=()=>{
    this.isPasting = false;
};
r.readAsDataURL(file);
},

/* =========================
🔥 核心修復版本
1. 改成連通區域偵測
2. Hold / Trace 會自動合併
3. 單鍵不容易被拆成三鍵四鍵
4. Ctrl+V 改成全域監聽
========================= */
startAnalysis(){

if(!this.uploadedImg) return;

this.view='result';
this.isAnalyzing=true;
this.noteTags=[];

const img=new Image();
img.src=this.uploadedImg;

img.onload=()=>{

const canvas=this.$refs.canvas;
const ctx=canvas.getContext('2d');

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

const image=ctx.getImageData(0,0,img.width,img.height);
const data=image.data;

const W=img.width;
const H=img.height;

/* 掃描格點，不要太密也不要太疏 */
const step=Math.max(2,Math.floor(Math.min(W,H)/320));

const visited=new Uint8Array(W*H);
const notes=[];

/* =========================
note 判定
========================= */
function isNote(x,y){

if(x<0 || y<0 || x>=W || y>=H) return false;

const i=(y*W+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];
const a=data[i+3];

if(a < 40) return false;

/* 掃描線 / 高亮排除 */
if(g>200 && b>200 && r<120) return false;

/* 常見 note / hold / trace 高亮 */
const light=(r+g+b)/3;

return (
    (b>140 && g>100) ||       /* 偏藍 */
    (r>170 && b>100) ||       /* 偏紫紅 */
    (r>180 && g>180) ||       /* 偏黃白 */
    (light>215)               /* 極亮區 */
);

}

/* =========================
4方向連通區域
========================= */
for(let y=0;y<H;y+=step){
for(let x=0;x<W;x+=step){

const idx=y*W+x;

if(visited[idx] || !isNote(x,y)) continue;

const queue=[[x,y]];
visited[idx]=1;

const pixels=[];

while(queue.length){

const [cx,cy]=queue.shift();
pixels.push([cx,cy]);

const dirs=[
[step,0],
[-step,0],
[0,step],
[0,-step]
];

for(const [dx,dy] of dirs){

const nx=cx+dx;
const ny=cy+dy;

if(nx<0 || ny<0 || nx>=W || ny>=H) continue;

const ni=ny*W+nx;
if(visited[ni]) continue;
if(!isNote(nx,ny)) continue;

visited[ni]=1;
queue.push([nx,ny]);

}

}

/* 雜點過濾：太小的不算 */
if(pixels.length < 8) continue;

/* =========================
判斷是否為 hold / trace
- 長條型、細長型、延伸型：偏向把重心放在尾端
- 一般單鍵：放在中心
========================= */
let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;

for(const [px,py] of pixels){
if(px < minX) minX = px;
if(py < minY) minY = py;
if(px > maxX) maxX = px;
if(py > maxY) maxY = py;
}

const width=maxX-minX;
const height=maxY-minY;
const area=pixels.length;
const ratio = Math.max(width, height) / Math.max(1, Math.min(width, height));

/* 若是很長的 hold / trace，採用更穩定的代表點 */
let centerX=(minX+maxX)/2;
let centerY=(minY+maxY)/2;

/* 垂直長條 hold */
if(height > width * 1.8 && area > 20){
    centerY = maxY;
}

/* 水平長條 trace / slider 類 */
if(width > height * 1.8 && area > 20){
    centerX = (minX + maxX) / 2;
    centerY = (minY + maxY) / 2;
}

/* 較大但不規則的 note，仍保留中心點 */
notes.push({
    x:centerX,
    y:centerY,
    width,
    height,
    area,
    ratio
});

}

}

/* =========================
去除重複
- 原本同一顆 note 周圍可能被掃成多群
- 用較大的距離門檻合併
========================= */
const final=[];

for(const n of notes){

const overlap=final.some(f=>{
const dx=f.x-n.x;
const dy=f.y-n.y;
return Math.sqrt(dx*dx+dy*dy) < 22;
});

if(!overlap){
final.push(n);
}

}

/* =========================
轉 note
========================= */
let detected=final.map((c,i)=>({

id:i,

x:(c.x/W)*100,
y:(c.y/H)*100,
hand:c.x<W/2 ? 'L' : 'R',
label:c.x<W/2 ? 'L0' : 'R0',

meta:{
width:c.width,
height:c.height,
area:c.area,
ratio:c.ratio
}

}));

/* fallback */
if(detected.length===0){
detected=[
{x:20,y:70,hand:'L',label:'L0',id:0,meta:{}},
{x:35,y:60,hand:'L',label:'L0',id:1,meta:{}},
{x:65,y:55,hand:'R',label:'R0',id:2,meta:{}},
{x:80,y:72,hand:'R',label:'R0',id:3,meta:{}}
];
}

this.noteTags=detected;

/* analysis */
const count=detected.length;

this.densityText =
count<=20 ? '低密度' :
count<=60 ? '中密度' : '高密度';

let l=0,r=0;
detected.forEach(n=>n.x<50 ? l++ : r++);

this.patternText =
Math.abs(l-r)>=10 ? '偏單手配置' :
count>=70 ? '高密度交互配置' : '均衡配置';

this.analysisOutput =
`偵測完成：${count} notes（Hold/Trace 已修復、單鍵防分裂、Ctrl+V 已修復）`;

setTimeout(()=>this.isAnalyzing=false,800);

};

},

generateTags(detected){

this.noteTags=detected.map((n,i)=>({
id:i,
...n
}));

},

generateAnalysis(detected){

const count=detected.length;

this.densityText =
count<=20 ? '低密度' :
count<=60 ? '中密度' : '高密度';

let l=0,r=0;

detected.forEach(n=>n.x<50 ? l++ : r++);

this.patternText =
Math.abs(l-r)>=10 ? '偏單手配置' :
count>=70 ? '高密度交互配置' : '均衡配置';

this.analysisOutput =
`偵測完成：${count} notes`;

}

}

}).mount('#app');
</script>

</body>
</html>
